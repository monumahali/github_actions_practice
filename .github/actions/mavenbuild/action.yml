name: mavenbuild

runs:
  using: "composite"

 
  steps:
    
    # Install uv
    - name: Install uv ${{ env.APP_NAME }}
      run: curl -Ls https://astral.sh/uv/install.sh | sh

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        # python-version: "3.11"
        python-version: ${{ matrix.python-version }}
    # Add uv to PATH
    - name: Add uv to PATH ${{ env.APP_NAME }}
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: echoing dummy variable
      run: echo "${{ inputs.dummy_var }}"


    # Create virtual env
    - name: Create venv
      run: uv venv

    # Install dependencies
    - name: Install dependencies
      run: uv pip install -r requirements.txt

    # Run tests
    - name: Run pytest
      run: uv run pytest

  
    - name: Install build tool
      run: pip install build

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

