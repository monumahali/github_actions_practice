name: mavenbuild
description: "Composite Python build"

inputs:
  python-version:
    required: true
  dummy_var:
    required: false
    default: "default value"

runs:
  using: "composite"

  steps:
    - name: Install uv
      run: iwr https://astral.sh/uv/install.ps1 -UseBasicParsing | iex #curl -Ls https://astral.sh/uv/install.sh | sh
      shell: powershell #pwsh

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Add uv to PATH
      run: echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH #echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      shell: powershell #pwsh

    - name: Echo input
      run: echo "${{ inputs.dummy_var }}"
      shell: powershell #pwsh

    - name: Create virtual environment
      run: uv venv
      shell: powershell #pwsh

    - name: Install dependencies
      run: uv pip install -r requirements.txt
      shell: powershell #pwsh

    - name: Run tests
      run: uv run pytest
      shell: powershell #pwsh

    - name: Install build tool
      run: python -m pip install build
      shell: powershell #pwsh

    - name: Build package
      run: python -m build
      shell: powershell #pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/
